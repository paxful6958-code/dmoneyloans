<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prêt D-Money</title>

    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f1f3f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .app-header {
            width: 100%;
            background: linear-gradient(to bottom, #5b2d8e, #7c3aed);
            padding: 20px 24px 40px;
            color: white;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .app-header .logo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .app-header .menu-icon {
            font-size: 28px;
            cursor: pointer;
        }
        
        .card {
            background: white;
            width: 92%;
            max-width: 450px;
            margin-top: -25px;
            padding: 30px 22px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
        }
        
        .card h2 {
            font-size: 22px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 4px;
        }
        
        .card .subtext {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-bottom: 28px;
        }
        
        .slider-section {
            margin-bottom: 24px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            color: #444;
            margin-bottom: 4px;
        }
        
        .accent-text {
            color: #7c3aed;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            accent-color: #7c3aed;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            margin: 10px 0 6px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: #7c3aed;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.4);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: #7c3aed;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.4);
        }
        
        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bbb;
        }
        
        .result-container {
            background: #faf8fe;
            border: 1px solid #f0eaf8;
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
            margin: 28px 0 24px;
        }
        
        .result-container p:first-child {
            font-size: 13px;
            color: #777;
            margin-bottom: 4px;
        }
        
        .result-value {
            color: #7c3aed;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .btn-apply {
            background: linear-gradient(to right, #5b2d8e, #7c3aed);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            letter-spacing: 0.3px;
        }
        
        .btn-apply:active {
            opacity: 0.85;
        }
        
        .footer {
            text-align: center;
            font-size: 11px;
            color: #ccc;
            margin: 32px 0 20px;
            padding-bottom: 16px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="app-header">
        <span class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn_5VYmxA4NGfip7K56How6z7pn9bFgakJPQwVOc3iyQ&s=10" alt="D-Money">
            <span>D-Money</span>
        </span>
        <span class="menu-icon">☰</span>
    </div>

    <!-- Main Card -->
    <div class="card">
        <h2>Prêt Rapide</h2>
        <p class="subtext">Approbation rapide • Taux compétitifs • Durées flexibles</p>

        <!-- Amount Slider -->
        <div class="slider-section">
            <h2 class="calculator-title">Calculateur de Prêt</h2>
            <div class="slider-header">
                <span>Montant du Prêt</span>
                <span id="valAmt" class="accent-text">1 750 000 DJF</span>
            </div>
            <input type="range" id="amt" min="175000" max="8750000" step="175000" value="1750000">
            <div class="slider-footer">
                <span>175 000 DJF</span>
                <span>8 750 000 DJF</span>
            </div>
        </div>

        <!-- Duration Slider -->
        <div class="slider-section">
            <div class="slider-header">
                <span>Durée du Prêt</span>
                <span id="valDur" class="accent-text">12 mois</span>
            </div>
            <input type="range" id="dur" min="6" max="60" step="6" value="12">
            <div class="slider-footer">
                <span>6 mois</span>
                <span>60 mois</span>
            </div>
        </div>

        <!-- Monthly Payment Result -->
        <div class="result-container">
            <p>Paiement Mensuel</p>
            <p id="monthly" class="result-value">172 083 DJF</p>
        </div>

        <!-- Apply Button -->
        <button class="btn-apply" onclick="goToPage2()">DEMANDER MAINTENANT</button>
    </div>

    <!-- Footer -->
    <div class="footer">© 2025 D-Money Djibouti</div>

    <script>
        // ---------- Format number with thousands separator ----------
        function fmt(n) {
            return Math.round(n).toLocaleString('fr-FR');
        }

        // ---------- Update display on slider change ----------
        function updateDisplay() {
            const amountInput = document.getElementById('amt');
            const durationInput = document.getElementById('dur');

            if (!amountInput || !durationInput) return;

            const amount = Number(amountInput.value) || 0;
            const duration = Number(durationInput.value) || 1;

            // Update labels
            document.getElementById('valAmt').textContent = `${fmt(amount)} DJF`;
            document.getElementById('valDur').textContent = `${duration} mois`;

            // Monthly payment: (amount × 1.18) / duration
            const monthly = (amount * 1.18) / duration;
            document.getElementById('monthly').textContent = `${fmt(monthly)} DJF`;
        }

        // ---------- Navigate to page2 ----------
        function goToPage2() {
            const amountInput = document.getElementById('amt');
            const durationInput = document.getElementById('dur');

            if (!amountInput || !durationInput) return;

            // Save to localStorage for the next page
            localStorage.setItem('amount', amountInput.value);
            localStorage.setItem('loanDuration', durationInput.value + ' Mois');

            // Navigate to page2.html (same directory)
            window.location.href = 'page2.html';
        }

        // ---------- On page load ----------
        window.addEventListener('DOMContentLoaded', function() {
            // Telegram WebApp integration
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // Attach slider events
            const amountInput = document.getElementById('amt');
            const durationInput = document.getElementById('dur');

            if (amountInput) amountInput.addEventListener('input', updateDisplay);
            if (durationInput) durationInput.addEventListener('input', updateDisplay);

            // Initial calculation
            updateDisplay();
        });
    </script>

</body>

</html>
